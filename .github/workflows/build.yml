name: Build ROM

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python for the asset maker
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-numpy

      - name: Check 3D cockpit near-plane projection and ship/station wireframes
        run: python3 tests/space_projection_audit.py

      - name: Check GBA and PC station docking perspective geometry
        run: python3 tests/space_station_depth_audit.py

      - name: Check shared monster roster, generated art and biome spawn pools
        run: python3 tests/monster_roster.py

      - name: Check How Big Is It values, labels and scientific estimates
        run: python3 tests/facts_audit.py

      - name: Make the assets and build the ROM
        run: |
          export PATH=/opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:$PATH
          python3 gen.py
          make clean
          make TC=arm-none-eabi-

      - name: Upload the ROM
        uses: actions/upload-artifact@v4
        with:
          name: bugstar-rom
          path: bugstar.gba
