name: PC kart and world generation regression
on:
  push:
    paths:
      - 'kart*.inc'
      - 'planet.inc'
      - 'town.inc'
      - 'pc/pc_kartnat*.inc'
      - 'pc/pc_snative.inc'
      - 'pc/pc_multiplayer.inc'
      - 'pc/platform/pc_net*.c'
      - 'pc/platform/pc_net.h'
      - 'pc/build.sh'
      - 'tests/pc_multiplayer_net_test.c'
      - 'net/**'
      - 'tests/multiplayer_protocol_test.c'
      - 'tests/space_native_projection_audit.py'
      - 'tests/space_station_depth_audit.py'
      - 'pc/pc_hw.c'
      - 'pc/platform/pc_sdl.c'
      - 'pc/tests/speed_guard.sh'
      - 'pc/tests/kart.sh'
      - '.github/workflows/pc-kart-worldgen.yml'
  pull_request:
    paths:
      - 'kart*.inc'
      - 'planet.inc'
      - 'town.inc'
      - 'pc/pc_kartnat*.inc'
      - 'pc/pc_snative.inc'
      - 'pc/pc_multiplayer.inc'
      - 'pc/platform/pc_net*.c'
      - 'pc/platform/pc_net.h'
      - 'pc/build.sh'
      - 'tests/pc_multiplayer_net_test.c'
      - 'net/**'
      - 'tests/multiplayer_protocol_test.c'
      - 'tests/space_native_projection_audit.py'
      - 'tests/space_station_depth_audit.py'
      - 'pc/pc_hw.c'
      - 'pc/platform/pc_sdl.c'
      - 'pc/tests/speed_guard.sh'
      - 'pc/tests/kart.sh'
      - '.github/workflows/pc-kart-worldgen.yml'
  workflow_dispatch:

jobs:
  pc-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install procedural asset generator requirements
        run: sudo apt-get update && sudo apt-get install -y python3-numpy python3-pil build-essential
      - name: Exercise native 3D perspective and near-plane regression with UBSan
        run: python3 tests/space_native_projection_audit.py
      - name: Guard space station 3D depth and shared geometry
        run: python3 tests/space_station_depth_audit.py
      - name: Compile and fuzz the multiplayer packet contract
        run: cc -std=c99 -O1 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/multiplayer_protocol_test.c net/session.c -o /tmp/bugstar-nettest && /tmp/bugstar-nettest
      - name: Validate two actual UDP sockets and independently moving LAN ships
        run: cc -std=c99 -O1 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/pc_multiplayer_net_test.c pc/platform/pc_net.c net/session.c -o /tmp/bugstar-lan && timeout 15 /tmp/bugstar-lan
      - name: Build PC game without SDL dependency
        run: cd pc && PC_SDL=0 ./build.sh
      - name: Fuzz kart races across random tracks
        run: cd pc && bash tests/kart.sh 8
      - name: Check kart races under AddressSanitizer
        run: cd pc && ASAN=1 bash tests/kart.sh 4
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pc-kart-regression-logs
          path: pc/out/kz.log
          if-no-files-found: ignore

  pc-native-kart-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build requirements and SDL2
        run: sudo apt-get update && sudo apt-get install -y python3-numpy python3-pil build-essential libsdl2-2.0-0
      - name: Build PC window with scripted kart fuzz
        run: cd pc && PC_CFLAGS="-DTEST_KW -DTEST_KFUZZ=600" ./build.sh
      - name: Render real native kart frames in SDL dummy window
        run: |
          cd pc
          mkdir -p out
          : > out/empty.keys
          SDL_AUDIODRIVER=dummy PC_V3D=1 PC_KNX=1 KFUZZ_RACES=1 timeout 120 \
            ./bugstar_pc --window --video-driver dummy --no-audio --fast \
            --size 960 640 --script out/empty.keys --sav out/kart-native-smoke.sav \
            --auto-shot 320 out/kart-native-smoke.png --stop-after 324 \
            > out/kart-native-smoke.log 2>&1
          grep -q 'KFUZZ RENDER ENTRY' out/kart-native-smoke.log
          test -s out/kart-native-smoke.png
          SDL_AUDIODRIVER=dummy PC_V3D=2 KFUZZ_RACES=1 timeout 120 \
            ./bugstar_pc --window --video-driver dummy --no-audio --fast \
            --size 960 640 --script out/empty.keys --sav out/kart-classic-smoke.sav \
            --auto-shot 320 out/kart-classic-smoke.png --stop-after 324 \
            > out/kart-classic-smoke.log 2>&1
          grep -q 'KFUZZ RENDER ENTRY' out/kart-classic-smoke.log
          test -s out/kart-classic-smoke.png
      - name: Upload native window screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-native-kart-window
          path: |
            pc/out/kart-native-smoke.png
            pc/out/kart-native-smoke.log
            pc/out/kart-classic-smoke.png
            pc/out/kart-classic-smoke.log
          if-no-files-found: ignore

  pc-speed-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 and build requirements
        run: sudo apt-get update && sudo apt-get install -y python3-numpy python3-pil build-essential libsdl2-2.0-0
      - name: Build normal PC gameplay with SDL
        run: cd pc && PC_OUT=bugstar_pc_rate ./build.sh
      - name: Verify real GBA-speed gameplay, high refresh and stall recovery
        run: cd pc && bash tests/speed_guard.sh ./bugstar_pc_rate
      - name: Upload timing diagnostics if a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pc-speed-guard-logs
          path: pc/out/speed_guard/
          if-no-files-found: ignore
