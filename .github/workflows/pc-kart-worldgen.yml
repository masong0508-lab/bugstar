name: PC kart and world generation regression
on:
  push:
    paths:
      - 'kart*.inc'
      - 'game.inc'
      - 'dungeon.inc'
      - 'ui.inc'
      - 'main.c'
      - 'tests/quest_integrity_audit.py'
      - 'tests/quest_runtime_host.py'
      - 'tests/list_picker_runtime_host.py'
      - 'tests/kart_world_save_runtime.py'
      - 'tests/shared_math_runtime_host.py'
      - 'tests/kart_native_camera_runtime.py'
      - 'tests/kart_native_sampler_runtime.py'
      - 'tests/kart_visual_capture_audit.py'
      - 'tests/kart_fuzz_fade_runtime.py'
      - 'tests/kart_dma_palette_runtime_host.py'
      - 'ui.inc'
      - 'planet.inc'
      - 'town.inc'
      - 'pc/pc_kartnat*.inc'
      - 'pc/pc_snative.inc'
      - 'pc/pc_multiplayer.inc'
      - 'pc/platform/pc_net*.c'
      - 'pc/platform/pc_net.h'
      - 'pc/build.sh'
      - 'tests/pc_multiplayer_net_test.c'
      - 'tests/pc_multiplayer_duel_test.c'
      - 'tests/pc_multiplayer_coop_test.c'
      - 'tests/pc_multiplayer_coop_net_test.c'
      - 'pc/platform/pc_coop.c'
      - 'pc/platform/pc_coop.h'
      - 'pc/tests/lan_live.sh'
      - 'pc/tests/lan_menu.sh'
      - 'net/**'
      - 'tests/multiplayer_protocol_test.c'
      - 'tests/space_native_projection_audit.py'
      - 'tests/space_station_depth_audit.py'
      - 'pc/pc_hw.c'
      - 'pc/platform/pc_sdl.c'
      - 'pc/tests/speed_guard.sh'
      - 'pc/tests/native_space_perf.sh'
      - 'pc/tests/kart.sh'
      - 'pc/tests/kart_fuzz.inc'
      - '.github/workflows/pc-kart-worldgen.yml'
  pull_request:
    paths:
      - 'kart*.inc'
      - 'game.inc'
      - 'dungeon.inc'
      - 'ui.inc'
      - 'main.c'
      - 'tests/quest_integrity_audit.py'
      - 'tests/quest_runtime_host.py'
      - 'tests/list_picker_runtime_host.py'
      - 'tests/kart_world_save_runtime.py'
      - 'tests/shared_math_runtime_host.py'
      - 'tests/kart_native_camera_runtime.py'
      - 'tests/kart_native_sampler_runtime.py'
      - 'tests/kart_visual_capture_audit.py'
      - 'tests/kart_fuzz_fade_runtime.py'
      - 'tests/kart_dma_palette_runtime_host.py'
      - 'ui.inc'
      - 'planet.inc'
      - 'town.inc'
      - 'pc/pc_kartnat*.inc'
      - 'pc/pc_snative.inc'
      - 'pc/pc_multiplayer.inc'
      - 'pc/platform/pc_net*.c'
      - 'pc/platform/pc_net.h'
      - 'pc/build.sh'
      - 'tests/pc_multiplayer_net_test.c'
      - 'tests/pc_multiplayer_duel_test.c'
      - 'tests/pc_multiplayer_coop_test.c'
      - 'tests/pc_multiplayer_coop_net_test.c'
      - 'pc/platform/pc_coop.c'
      - 'pc/platform/pc_coop.h'
      - 'pc/tests/lan_live.sh'
      - 'pc/tests/lan_menu.sh'
      - 'net/**'
      - 'tests/multiplayer_protocol_test.c'
      - 'tests/space_native_projection_audit.py'
      - 'tests/space_station_depth_audit.py'
      - 'pc/pc_hw.c'
      - 'pc/platform/pc_sdl.c'
      - 'pc/tests/speed_guard.sh'
      - 'pc/tests/native_space_perf.sh'
      - 'pc/tests/kart.sh'
      - 'pc/tests/kart_fuzz.inc'
      - '.github/workflows/pc-kart-worldgen.yml'
  workflow_dispatch:

jobs:
  pc-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install procedural asset generator requirements
        run: sudo apt-get update && sudo apt-get install -y python3-numpy python3-pil build-essential
      - name: Exercise 50-slot menu scrolling and selection with UndefinedBehaviorSanitizer
        run: python3 tests/list_picker_runtime_host.py
      - name: Exercise Kart World saved settings and 18-driver navigation with UBSan
        run: python3 tests/kart_world_save_runtime.py
      - name: Guard shared signed division against overflow and zero denominators
        run: python3 tests/shared_math_runtime_host.py
      - name: Check speed-aware native kart banking and limited hill displacement under UBSan
        run: python3 tests/kart_native_camera_runtime.py
      - name: Verify native kart sampler keeps pixels identical on flat road textures
        run: python3 tests/kart_native_sampler_runtime.py
      - name: Confirm fuzz races match real fade-in and clear boot blackout
        run: python3 tests/kart_fuzz_fade_runtime.py
      - name: Verify kart HUD DMA palette words under UndefinedBehaviorSanitizer
        run: python3 tests/kart_dma_palette_runtime_host.py
      - name: Audit quest targets, world gates and guaranteed rewards
        run: python3 tests/quest_integrity_audit.py
      - name: Execute real quest pickup code with UndefinedBehaviorSanitizer
        run: python3 tests/quest_runtime_host.py
      - name: Exercise native 3D perspective and near-plane regression with UBSan
        run: python3 tests/space_native_projection_audit.py
      - name: Guard space station 3D depth and shared geometry
        run: python3 tests/space_station_depth_audit.py
      - name: Compile and fuzz the multiplayer packet contract
        run: cc -std=c99 -O1 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/multiplayer_protocol_test.c net/session.c -o /tmp/bugstar-nettest && /tmp/bugstar-nettest
      - name: Validate two actual UDP sockets and independently moving LAN ships
        run: cc -std=c99 -O1 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/pc_multiplayer_net_test.c pc/platform/pc_net.c pc/platform/pc_duel.c pc/platform/pc_coop.c net/session.c -lm -o /tmp/bugstar-lan && timeout 15 /tmp/bugstar-lan
      - name: Verify moving shared co-op target, synchronized victories, and enemy respawn
        run: cc -std=c99 -O1 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/pc_multiplayer_coop_test.c pc/platform/pc_coop.c pc/platform/pc_duel.c -lm -o /tmp/bugstar-coop && /tmp/bugstar-coop
      - name: Verify two actual UDP pilots fighting the SAME host-controlled enemy
        run: cc -std=c99 -O1 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/pc_multiplayer_coop_net_test.c pc/platform/pc_net.c pc/platform/pc_coop.c pc/platform/pc_duel.c net/session.c -lm -o /tmp/bugstar-coop-net && timeout 15 /tmp/bugstar-coop-net
      - name: Verify 3D sparring hits, safe match HP and respawn
        run: cc -std=c99 -O1 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/pc_multiplayer_duel_test.c pc/platform/pc_duel.c -lm -o /tmp/bugstar-duel && /tmp/bugstar-duel
      - name: Build PC game without SDL dependency
        run: cd pc && PC_SDL=0 ./build.sh
      - name: Fuzz kart races across random tracks
        run: cd pc && bash tests/kart.sh 8
      - name: Check kart races under AddressSanitizer
        run: cd pc && ASAN=1 bash tests/kart.sh 4
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pc-kart-regression-logs
          path: pc/out/kz.log
          if-no-files-found: ignore

  pc-native-kart-window:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install build requirements and SDL2
        run: sudo apt-get update && sudo apt-get install -y python3-numpy python3-pil build-essential libsdl2-2.0-0
      - name: Build PC window with scripted kart fuzz
        run: cd pc && PC_CFLAGS="-DTEST_KW -DTEST_KFUZZ=600" ./build.sh
      - name: Render real native kart frames in SDL dummy window
        run: |
          cd pc
          mkdir -p out
          : > out/empty.keys
          printf 'shot 96\nshot 160\nshot 240\nshot 320\n' > out/kart-visual.keys
          SDL_AUDIODRIVER=dummy PC_NATIVE=2 PC_SCALE=4 PC_V3D=1 PC_KNX=1 KFUZZ_RACES=1 timeout 120 \
            ./bugstar_pc --window --video-driver dummy --no-audio --fast \
            --size 960 640 --script out/kart-visual.keys --out out/kart-native-visual --sav out/kart-native-smoke.sav \
            --auto-shot 320 out/kart-native-smoke.png --stop-after 324 \
            > out/kart-native-smoke.log 2>&1
          grep -q 'KFUZZ RENDER ENTRY' out/kart-native-smoke.log
          test -s out/kart-native-smoke.png
          SDL_AUDIODRIVER=dummy PC_SCALE=4 PC_V3D=2 KFUZZ_RACES=1 timeout 120 \
            ./bugstar_pc --window --video-driver dummy --no-audio --fast \
            --size 960 640 --script out/kart-visual.keys --out out/kart-classic-visual --sav out/kart-classic-smoke.sav \
            --auto-shot 320 out/kart-classic-smoke.png --stop-after 324 \
            > out/kart-classic-smoke.log 2>&1
          grep -q 'KFUZZ RENDER ENTRY' out/kart-classic-smoke.log
          test -s out/kart-classic-smoke.png
          python3 ../tests/kart_visual_capture_audit.py out/kart-native-visual out/kart-classic-visual
      - name: Benchmark native kart composition and verify single/multithread picture parity
        run: |
          cd pc
          printf 'shot 320\n' > out/kart-bench.keys
          for threads in 1 4; do
            PC_NATIVE=2 PC_SCALE=4 PC_NBENCH=24 PC_THREADS="$threads" PC_V3D=1 PC_KNX=1 KFUZZ_RACES=1 timeout 120 \
              ./bugstar_pc --headless --script out/kart-bench.keys \
              --out "out/kart-bench-$threads" --sav "out/kart-bench-$threads.sav" --frames 324 \
              > "out/kart-bench-$threads.log" 2>&1
            grep 'native compose 960x640:' "out/kart-bench-$threads.log"
            test -s "out/kart-bench-${threads}_000320.ppm"
          done
          cmp out/kart-bench-1_000320.ppm out/kart-bench-4_000320.ppm
          echo 'Kart native picture parity (1 vs 4 render threads): PASS'
      - name: Upload native window screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-native-kart-window
          path: |
            pc/out/kart-native-smoke.png
            pc/out/kart-native-smoke.log
            pc/out/kart-classic-smoke.png
            pc/out/kart-classic-smoke.log
            pc/out/kart-native-visual_*.png
            pc/out/kart-classic-visual_*.png
            pc/out/kart-visual-report.json
            pc/out/kart-bench-1.log
            pc/out/kart-bench-4.log
          if-no-files-found: ignore

  pc-native-space:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 and native build requirements
        run: sudo apt-get update && sudo apt-get install -y python3-numpy python3-pil build-essential libsdl2-2.0-0
      - name: Build normal native-space PC game
        run: cd pc && PC_OUT=bugstar_pc_space ./build.sh
      - name: Benchmark per-body planet shading and verify exact multi-thread visuals
        run: cd pc && bash tests/native_space_perf.sh ./bugstar_pc_space
      - name: Upload native 3D space frame timing and image parity logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-native-space-perf
          path: pc/out/native_space/*.log
          if-no-files-found: ignore

  pc-speed-parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install SDL2 and build requirements
        run: sudo apt-get update && sudo apt-get install -y python3-numpy python3-pil build-essential libsdl2-2.0-0
      - name: Build normal PC gameplay with SDL
        run: cd pc && PC_OUT=bugstar_pc_rate ./build.sh
      - name: Verify real GBA-speed gameplay, high refresh and stall recovery
        run: cd pc && bash tests/speed_guard.sh ./bugstar_pc_rate
      - name: Verify real SDL options HOST, JOIN, IPv4 entry and LEAVE
        run: cd pc && bash tests/lan_menu.sh ./bugstar_pc_rate
      - name: Run two real PC space games with LAN and render both viewpoints
        run: cd pc && bash tests/lan_live.sh ./bugstar_pc_rate spar
      - name: Run two real PC space games with one shared co-op raider
        run: cd pc && bash tests/lan_live.sh ./bugstar_pc_rate coop
      - name: Upload LAN smoke screenshots and per-peer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-lan-space-smoke
          path: |
            pc/out/lan_menu/host-options.png
            pc/out/lan_menu/game.log
            pc/out/lan_menu/events.txt
            pc/out/lan_live/host.png
            pc/out/lan_live/client.png
            pc/out/lan_live/spar_host.png
            pc/out/lan_live/spar_client.png
            pc/out/lan_live/coop_host.png
            pc/out/lan_live/coop_client.png
            pc/out/lan_live/spar_host.log
            pc/out/lan_live/spar_client.log
            pc/out/lan_live/coop_host.log
            pc/out/lan_live/coop_client.log
            pc/out/lan_live/host.log
            pc/out/lan_live/client.log
          if-no-files-found: ignore
      - name: Upload timing diagnostics if a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pc-speed-guard-logs
          path: pc/out/speed_guard/
          if-no-files-found: ignore
