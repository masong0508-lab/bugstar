name: Android APK

# patch 21 (step 1 of pc/ANDROID_PLAN.md): builds the debug APK. Only runs when pc/android or this file changes, or by hand.
on:
  push:
    paths:
      - 'pc/android/**'
      - 'pc/*.c'
      - 'pc/*.h'
      - 'pc/*.inc'
      - 'pc/**/*.c'
      - 'pc/**/*.h'
      - 'pc/**/*.inc'
      - 'pc/build.sh'
      - 'pc/platform/**'
      - '*.inc'
      - '*.h'
      - 'facts.bin'
      - 'facts.py'
      - 'facts_more.py'
      - 'monsters.py'
      - 'gen.py'
      - 'tests/android_compat_runtime.py'
      - 'tests/android_apk_audit.py'
      - 'tests/space_native_projection_audit.py'
      - 'tests/space_station_depth_audit.py'
      - 'net/**'
      - 'tests/multiplayer_protocol_test.c'
      - 'tests/pc_multiplayer_net_test.c'
      - 'tests/pc_multiplayer_duel_test.c'
      - 'tests/pc_multiplayer_coop_test.c'
      - 'tests/pc_multiplayer_coop_net_test.c'
      - 'pc/platform/pc_coop.c'
      - 'pc/platform/pc_coop.h'
      - 'tests/monster_roster.py'
      - 'pc/facts/**'
      - 'tests/facts_audit.py'
      - 'main.c'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Get SDL2 (its Java files and the library; not committed)
        run: |
          git clone --depth 1 --branch release-2.30.9 https://github.com/libsdl-org/SDL.git pc/android/app/jni/SDL \
            || git clone --depth 1 --branch SDL2 https://github.com/libsdl-org/SDL.git pc/android/app/jni/SDL
          git -C pc/android/app/jni/SDL log -1 --oneline

      - name: Show the toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Python deps for the generators
        run: python3 -m pip install numpy pillow

      - name: Verify Android relocation, low-memory and small-screen geometry
        run: python3 tests/android_compat_runtime.py

      - name: Check shared 3D camera clipping
        run: python3 tests/space_projection_audit.py

      - name: Exercise native PC/Android 3D near-plane edges with UBSan
        run: python3 tests/space_native_projection_audit.py

      - name: Check GBA and native station docking geometry parity
        run: python3 tests/space_station_depth_audit.py

      - name: Host-check packet bounds and corruption before Android cross-play work
        run: cc -std=c99 -O1 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/multiplayer_protocol_test.c net/session.c -o /tmp/bugstar-nettest && /tmp/bugstar-nettest

      - name: Test two real LAN sockets, world matching and disconnects on the host
        run: cc -std=c99 -O1 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/pc_multiplayer_net_test.c pc/platform/pc_net.c pc/platform/pc_duel.c pc/platform/pc_coop.c net/session.c -lm -o /tmp/bugstar-lan && timeout 15 /tmp/bugstar-lan

      - name: Verify moving shared co-op target, synchronized victories, and enemy respawn
        run: cc -std=c99 -O1 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/pc_multiplayer_coop_test.c pc/platform/pc_coop.c pc/platform/pc_duel.c -lm -o /tmp/bugstar-coop && /tmp/bugstar-coop
      - name: Verify two actual UDP pilots fighting the SAME host-controlled enemy
        run: cc -std=c99 -O1 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/pc_multiplayer_coop_net_test.c pc/platform/pc_net.c pc/platform/pc_coop.c pc/platform/pc_duel.c net/session.c -lm -o /tmp/bugstar-coop-net && timeout 15 /tmp/bugstar-coop-net
      - name: Verify 3D sparring hits, safe match HP and respawn
        run: cc -std=c99 -O1 -Wall -Wextra -Werror -fsanitize=undefined -fno-sanitize-recover=all tests/pc_multiplayer_duel_test.c pc/platform/pc_duel.c -lm -o /tmp/bugstar-duel && /tmp/bugstar-duel
      - name: Check the 24 additional cross-port monster species
        run: python3 tests/monster_roster.py

      - name: Check GBA and expanded PC How Big Is It values
        run: BUGSTAR_PC=1 python3 tests/facts_audit.py

      - name: Prepare the game sources (writes pc/gen/sources.txt + cflags.txt for jni/src/Android.mk)
        run: PC_ANDROID_PREP=1 bash pc/build.sh

      # patch 46: the app must contain the newer features (the procedural sprite generators, the first-start tutorial page); a source list that lost them would still build
      - name: Check the game sources include the features
        run: |
          n=$(grep -c 'pc_sprgen' pc/gen/sources.txt); echo "sprite generator sources: $n"; [ "$n" -ge 10 ] || { echo "::error::the sprite generators are not in the Android source list"; exit 1; }
          for f in warship/ws.c laws/laws.c sim/sim_core.c giant/giant.c; do grep -qx "$f" pc/gen/sources.txt || { echo "::error::$f is missing from the Android source list"; exit 1; }; done
          for f in platform/pc_sdl.c platform/pc_net.c platform/pc_duel.c platform/pc_coop.c platform/pc_net_codec.c; do grep -qx "$f" pc/gen/sources.txt || { echo "::error::$f missing from Android LAN source list"; exit 1; }; done
          grep -q 'DPC_ANDROID' pc/gen/cflags.txt || { echo "::error::cflags.txt has no -DPC_ANDROID"; exit 1; }

      - name: Build the debug APK
        run: gradle -p pc/android assembleDebug --stacktrace

      # patch 35: things that make an APK install fine and then die on launch, found here instead of on the phone
      - name: Check the APK (libraries inside, SDL_main exported, page alignment)
        run: |
          APK=$(ls pc/android/app/build/outputs/apk/debug/bugstar-*-debug.apk | head -1)
          echo "APK: $APK"
          ls -l "$APK"
          python3 tests/android_apk_audit.py "$APK"
          unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|arm64-v8a|x86|x86_64)/' || true
          for l in libSDL2.so libmain.so; do
            unzip -l "$APK" | grep -q "lib/arm64-v8a/$l" || { echo "::error::$l is not in the APK: the app would close the moment it starts"; exit 1; }
          done
          SO=$(find pc/android/app/build -path '*arm64-v8a*' -name libmain.so | head -1)
          echo "libmain.so: $SO"
          NM=$(find "$ANDROID_NDK_HOME" "$ANDROID_NDK_LATEST_HOME" -name llvm-nm 2>/dev/null | head -1)
          RE=$(find "$ANDROID_NDK_HOME" "$ANDROID_NDK_LATEST_HOME" -name llvm-readelf 2>/dev/null | head -1)
          grep -aq 'HOW TO PLAY' "$SO" && echo "feature check: the tutorial page is in libmain.so" || { echo "::error::libmain.so lacks the HOW TO PLAY page"; exit 1; }
          for title in 'EVERY 60 GBA SCREEN FRAMES' 'PC: LAW SETS X UNIVERSES'; do
            grep -aq "$title" "$SO" || { echo "::error::Android library is missing current HOW BIG IS IT page: $title"; exit 1; }
          done
          echo "feature check: updated 60-frame and 2,048-bit PC number pages are in the Android APK"
          grep -aq 'low memory: sprite cache emptied' "$SO" && echo "feature check: the low-memory handler is in libmain.so" || { echo "::error::libmain.so lacks the low-memory handler"; exit 1; }
          test -n "$NM" || { echo "::error::llvm-nm not found"; exit 1; }
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            so=$(find pc/android/app/build -path "*/$abi/libmain.so" | head -1)
            test -n "$so" && "$NM" -D --defined-only "$so" | grep -E ' SDL_main$' || { echo "::error::$abi libmain.so does not export SDL_main"; exit 1; }
          done
          if [ -n "$RE" ] && [ -n "$SO" ]; then "$RE" -lW "$SO" | grep -E 'LOAD' || true; fi
          ZA=$(find "$ANDROID_HOME/build-tools" -name zipalign 2>/dev/null | sort -V | tail -1)
          test -n "$ZA" && "$ZA" -c -P 16 -v 4 "$APK" || { echo "::error::APK zip alignment failed"; exit 1; }

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: bugstar-apk
          path: pc/android/app/build/outputs/apk/debug/bugstar-*-debug.apk

      # the unstripped libmain.so: the crash report lists "pc <offset> libmain.so", and with this file  llvm-addr2line -f -e libmain.so <offset>  names the line
      - name: Keep the symbols
        if: always()
        run: |
          mkdir -p symbols
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            SO=$(find pc/android/app/build -path "*obj/local/$abi*" -name libmain.so | head -1)
            if [ -n "$SO" ]; then mkdir -p "symbols/$abi"; cp "$SO" "symbols/$abi/libmain.so"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bugstar-symbols
          path: symbols
          if-no-files-found: ignore

  emulator-smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 21
            arch: x86
          - api: 35
            arch: x86_64
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bugstar-apk
          path: apk
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r "$(find apk -name '*.apk' | head -1)"
            adb logcat -c
            adb shell am start -W -n org.bugstar.app/.BugstarActivity
            for n in $(seq 1 45); do adb logcat -d -s BUGSTAR_BOOT:I | grep -q 'first rendered game frame' && break; sleep 2; done
            adb logcat -d > android-boot.log
            grep -q 'first rendered game frame' android-boot.log
            adb shell ps | grep org.bugstar.app
            adb exec-out screencap -p > android-boot.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-${{ matrix.api }}-${{ matrix.arch }}
          path: |
            android-boot.log
            android-boot.png
          if-no-files-found: ignore
