name: Android APK

# patch 21 (step 1 of pc/ANDROID_PLAN.md): builds the debug APK. Only runs when pc/android or this file changes, or by hand.
on:
  push:
    paths:
      - 'pc/android/**'
      - 'pc/*.c'
      - 'pc/*.h'
      - 'pc/build.sh'
      - 'pc/platform/**'
      - '*.inc'
      - 'main.c'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Get SDL2 (its Java files and the library; not committed)
        run: |
          git clone --depth 1 --branch release-2.30.9 https://github.com/libsdl-org/SDL.git pc/android/app/jni/SDL \
            || git clone --depth 1 --branch SDL2 https://github.com/libsdl-org/SDL.git pc/android/app/jni/SDL
          git -C pc/android/app/jni/SDL log -1 --oneline

      - name: Show the toolchain
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Prepare the game sources (writes pc/gen/sources.txt + cflags.txt for jni/src/Android.mk)
        run: PC_ANDROID_PREP=1 bash pc/build.sh

      - name: Build the debug APK
        run: gradle -p pc/android assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: bugstar-apk
          path: pc/android/app/build/outputs/apk/debug/app-debug.apk
