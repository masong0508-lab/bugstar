plugins {
    id 'com.android.application'
}

android {
    namespace 'org.bugstar.app'
    compileSdk 34

    // GitHub's Ubuntu runner has an NDK installed; use it instead of letting Gradle download one.
    // Its path AND its version must be given together: AGP refuses a path whose version differs from ndkVersion (that was the first CI failure).
    def ndkHome = System.getenv('ANDROID_NDK_HOME') ?: System.getenv('ANDROID_NDK_LATEST_HOME')
    def ndkProps = ndkHome ? new File(ndkHome, 'source.properties') : null
    if (ndkProps != null && ndkProps.exists()) {
        def np = new Properties()
        ndkProps.withInputStream { np.load(it) }
        def rev = np.getProperty('Pkg.Revision')
        if (rev) {
            ndkVersion rev.trim()
            ndkPath ndkHome
        }
    }

    defaultConfig {
        applicationId 'org.bugstar.app'
        minSdk 24
        targetSdk 34          // 34, not newer: no forced edge-to-edge layout for SDL2 to trip over
        versionCode 24
        versionName '0.24-spike'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { ndkBuild { arguments 'APP_PLATFORM=android-24' } }
    }

    externalNativeBuild { ndkBuild { path 'jni/Android.mk' } }

    sourceSets {
        main {
            // SDL's own Java side (SDLActivity and friends), from the SDL clone the workflow makes
            java.srcDirs = ['src/main/java', 'jni/SDL/android-project/app/src/main/java']
        }
    }
}
